# Workbench's dedicated tmux server (socket: workbench). Kept alive with no
# sessions so the systemd unit stays active.
set -g exit-empty off
set -g default-terminal "tmux-256color"
set -g history-limit 20000
set -g mouse on
set -g status off
set -g escape-time 10
# Report shell exits so the worker can record exit codes.
set -g remain-on-exit on
